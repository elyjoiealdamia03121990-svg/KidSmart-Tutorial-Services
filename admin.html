<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidSmart Back Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EE;--card:#fff;--ink:#1E2944;--muted:#5D6785;--line:#E9E2D6;--coral:#FF6B5B;--coral-soft:#FFE3DF;
  --teal:#20A99A;--teal-soft:#D9F3EF;--sun:#FFB627;--sun-soft:#FFF0CC;--sky:#4C8DF6;--sky-soft:#E1ECFE;--side:#1E2944}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0;line-height:1.2}
button,input,select,textarea{font:600 15px Nunito,sans-serif;color:var(--ink)}
input,select,textarea{width:100%;padding:9px 11px;border:2px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-weight:800;font-size:13px;margin-bottom:4px;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.c{background:var(--coral)}.btn.t{background:var(--teal)}.btn.g{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:#fff;border-radius:20px;padding:30px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(30,41,68,.1)}
#app{display:none}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);color:#C9D0E3;padding:18px 12px;display:flex;flex-direction:column}
aside .brand{font:700 20px Fredoka;color:#fff;padding:0 10px 18px}
aside .brand b{color:var(--sun)}
aside a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:inherit;font-weight:700;cursor:pointer;text-decoration:none}
aside a.on,aside a:hover{background:rgba(255,255,255,.1);color:#fff}
aside a .cnt{margin-left:auto;background:var(--coral);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
aside .who{margin-top:auto;padding:10px 12px;font-size:13px}
.mlogout{display:none!important}
main{margin-left:220px;padding:24px;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h2{font-size:26px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(30,41,68,.05);margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(30,41,68,.05)}
.kpi .v{font:700 26px Fredoka}.kpi .l{color:var(--muted);font-weight:700;font-size:13px}
.kpi.alert{background:var(--coral-soft)}.kpi.good{background:var(--teal-soft)}.kpi.click{cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#FBF8F3}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.bg-green{background:var(--teal-soft);color:#0F7A6E}.bg-yellow{background:var(--sun-soft);color:#946200}
.bg-red{background:var(--coral-soft);color:#A9302A}.bg-blue{background:var(--sky-soft);color:#2A61C4}.bg-gray{background:#eee;color:#666}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:140px}
.row>.btn{flex:0 0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px;cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(30,41,68,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:820px;padding:22px;position:relative}
.mbox .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.sect{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sect h3{font-size:17px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted);font-weight:700}
.receipt{max-width:300px;width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:99;display:none}
.toast.err{background:#C23C2E}
.bars{display:flex;align-items:flex-end;gap:14px;height:160px;padding-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;font-weight:700;color:var(--muted)}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars span{display:block;width:40%;max-width:26px;border-radius:6px 6px 2px 2px;min-height:2px}
.legend{display:flex;gap:16px;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.alertbox{background:var(--sun-soft);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px}
@media(max-width:860px){
  aside{position:sticky;top:0;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;inset:auto}
  aside .brand,aside .who{display:none}
  aside a{padding:8px 10px;flex:none;font-size:14px}
  aside a.mlogout{display:flex!important}
  main{margin-left:0;padding:14px}
}
</style>
</head>
<body>
<div id="login"><div class="lbox">
  <h1 style="font-size:26px">KidSmart Back Office</h1><p class="muted">Admin login</p>
  <label>Password</label><input type="password" id="lPass">
  <button class="btn c" style="width:100%;padding:12px;margin-top:12px" id="lBtn">Log in</button>
  <div id="lErr" style="color:#C23C2E;font-weight:700;margin-top:10px"></div>
</div></div>

<div id="app">
  <aside><div class="brand">Kid<b>Smart</b> AI</div><nav id="menu"></nav><div class="who">Admin<br><a style="padding:6px 0" onclick="logout()">Log out</a></div></aside>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="mbox"><button class="x" onclick="closeModal()">×</button><div id="mbody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', {maximumFractionDigits: 2});
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
function todayISO() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
function fmtDate(d) { return d ? new Date(d.slice(0, 10) + 'T00:00:00').toLocaleDateString('en-PH', {month: 'short', day: 'numeric', year: 'numeric'}) : '-'; }
function toast(t, bad) { const e = $('#toast'); e.textContent = t; e.className = 'toast' + (bad ? ' err' : ''); e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2800); }
let TOKEN = lsGet('ks_admin_token'), VIEW = '', CFG = null;

async function api(url, data) {
  const o = {headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN}};
  if (data !== undefined) { o.method = 'POST'; o.body = JSON.stringify(data); }
  let r, j; try { r = await fetch(url, o); j = await r.json(); } catch (e) { j = {ok: false, error: 'Server error'}; }
  if (r && r.status === 401) logout();
  if (!j.ok && j.error) toast(j.error, true);
  return j;
}
$('#lBtn').onclick = async () => {
  const j = await (await fetch('/api/admin/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: $('#lPass').value})})).json();
  if (!j.ok) return $('#lErr').textContent = j.error;
  TOKEN = j.token; lsSet('ks_admin_token', TOKEN); start();
};
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('#login').style.display !== 'none') $('#lBtn').click(); if (e.key === 'Escape') closeModal(); });
function logout() { TOKEN = ''; lsSet('ks_admin_token', ''); $('#app').style.display = 'none'; $('#login').style.display = 'grid'; }
function openModal(h) { $('#mbody').innerHTML = h; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

const SUB = {active: ['Active', 'bg-green'], trial: ['Trial', 'bg-yellow'], expired: ['Expired', 'bg-red'], blocked: ['On hold', 'bg-gray']};
const PAY = {for_verification: ['Check receipt', 'bg-yellow'], paid: ['Approved', 'bg-green'], rejected: ['Rejected', 'bg-red']};
const METHOD = {gcash: 'GCash', maya: 'Maya', bank: 'Bank'};
const badge = (m, k) => { const b = m[k] || [k, 'bg-gray']; return `<span class="badge ${b[1]}">${b[0]}</span>`; };
const MENU = [['dash', '🏠 Dashboard'], ['payments', '💳 Payments'], ['parents', '👪 Parents'], ['learners', '🧒 Learners'], ['plans', '💰 Plans'], ['expenses', '🧾 Expenses'], ['reports', '📊 Reports'], ['settings', '⚙️ Settings']];

async function start() {
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  CFG = await (await fetch('/api/public/config')).json();
  $('#menu').innerHTML = MENU.map(([k, l]) => `<a data-v="${k}">${l}<span class="cnt" id="cnt_${k}" hidden></span></a>`).join('') + '<a class="mlogout" onclick="logout()">🚪 Log out</a>';
  $('#menu').onclick = e => { const a = e.target.closest('a'); if (a && a.dataset.v) go(a.dataset.v); };
  go('dash');
}
function go(v, arg) {
  VIEW = v;
  document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  ({dash, payments, parents, learners, plans, expenses, reports, settings})[v](arg);
}

// ---------- dashboard
async function dash() {
  const j = await api('/api/admin/dashboard'); if (!j.ok) return;
  const c = $('#cnt_payments'); c.textContent = j.to_verify; c.hidden = !j.to_verify;
  $('#main').innerHTML = `<div class="top"><h2>Dashboard</h2><a class="btn c" href="/" target="_blank">Open website</a></div>
  ${!j.ai_key ? '<div class="alertbox">⚠️ AI key is not set yet - the app is using the built-in lessons. Add ANTHROPIC_API_KEY on Render to turn on the AI tutor.</div>' : (!j.ai_on ? '<div class="alertbox">AI tutor is switched OFF in Settings - kids get the built-in lessons.</div>' : '')}
  <div class="kpis">
    <div class="kpi click ${j.to_verify ? 'alert' : ''}" onclick="go('payments','for_verification')"><div class="v">${j.to_verify}</div><div class="l">Receipts to check</div></div>
    <div class="kpi good click" onclick="go('parents','active')"><div class="v">${j.active}</div><div class="l">Paying subscribers</div></div>
    <div class="kpi click" onclick="go('parents','trial')"><div class="v">${j.trial}</div><div class="l">On free trial</div></div>
    <div class="kpi click" onclick="go('parents','expired')"><div class="v">${j.expired}</div><div class="l">Expired</div></div>
    <div class="kpi"><div class="v">${peso(j.revenue_month)}</div><div class="l">Revenue this month</div></div>
    <div class="kpi"><div class="v">${peso(j.ai_cost_month)}</div><div class="l">AI cost this month</div></div>
    <div class="kpi"><div class="v">${j.learners}</div><div class="l">Learners</div></div>
    <div class="kpi"><div class="v">${j.learners_today} / ${j.rounds_today}</div><div class="l">Kids / rounds today</div></div>
  </div>
  <div class="g2"><div class="card"><h3 style="margin-bottom:10px">Latest payments</h3>${j.recent.length ? `<table>${j.recent.map(p => `<tr class="click" onclick="openPay(${p.id})"><td><b>${esc(p.parent_name)}</b><div class="small muted">${esc(p.created_at)}</div></td><td>${esc(p.plan_name)}<br><b>${peso(p.amount)}</b></td><td>${badge(PAY, p.status)}</td></tr>`).join('')}</table>` : '<div class="empty">No payments yet.</div>'}</div>
  <div class="card"><h3 style="margin-bottom:10px">Ending in the next 5 days</h3>${j.expiring.length ? `<table>${j.expiring.map(p => `<tr class="click" onclick="openParent(${p.id})"><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.phone)}</div></td><td>${fmtDate(p.until)}</td></tr>`).join('')}</table><p class="small muted">Send them a friendly reminder to renew.</p>` : '<div class="empty">None.</div>'}</div></div>`;
}

// ---------- payments
let payFilter = 'for_verification';
async function payments(f) {
  if (typeof f === 'string') payFilter = f;
  const j = await api('/api/admin/payments?filter=' + payFilter); if (!j.ok) return;
  const flt = [['for_verification', 'To check'], ['paid', 'Approved'], ['rejected', 'Rejected'], ['', 'All']];
  $('#main').innerHTML = `<div class="top"><h2>Payments</h2></div><div class="card"><div class="filters" id="pf" style="margin-bottom:12px">${flt.map(([k, l]) => `<button data-k="${k}" class="${k === payFilter ? 'on' : ''}">${l}</button>`).join('')}</div>
   ${j.payments.length ? `<div class="tw"><table><tr><th>Code</th><th>Parent</th><th>Plan</th><th>Amount</th><th>Method / ref</th><th>Sent</th><th>Status</th></tr>
   ${j.payments.map(p => `<tr class="click" onclick="openPay(${p.id})"><td><b>${esc(p.code)}</b></td><td>${esc(p.parent_name)}<div class="small muted">${esc(p.phone)}</div></td><td>${esc(p.plan_name)}<div class="small muted">${p.days} days</div></td>
   <td><b>${peso(p.amount)}</b></td><td>${METHOD[p.method] || ''}<div class="small muted">${esc(p.ref)}</div></td><td class="small">${esc(p.created_at)}</td><td>${badge(PAY, p.status)}</td></tr>`).join('')}</table></div>` : '<div class="empty">Nothing here.</div>'}</div>`;
  $('#pf').onclick = e => { const b = e.target.closest('button'); if (b) payments(b.dataset.k); };
}
async function openPay(id) {
  const j = await api('/api/admin/payments/' + id); if (!j.ok) return;
  const p = j.payment, pa = j.parent || {};
  openModal(`<h2 style="font-size:22px">${esc(p.code)} · ${peso(p.amount)}</h2><div style="margin:6px 0">${badge(PAY, p.status)}</div>
   <div class="g2" style="margin-top:12px"><div class="kv"><div>Parent</div><div><a href="#" onclick="openParent(${p.parent_id});return false">${esc(pa.name)}</a></div><div>Mobile</div><div>${esc(pa.phone)}</div>
     <div>Now</div><div>${pa.subscription ? badge(SUB, pa.subscription.state) + ' ' + fmtDate(pa.subscription.until) : ''}</div><div>Plan</div><div>${esc(p.plan_name)} (${p.days} days)</div>
     <div>Method</div><div>${METHOD[p.method] || ''}</div><div>Reference</div><div><b>${esc(p.ref) || '-'}</b></div><div>Sent</div><div>${esc(p.created_at)}</div>${p.verified_at ? `<div>Checked</div><div>${esc(p.verified_at)}</div>` : ''}</div>
   <div>${p.receipt ? `<img class="receipt" src="${p.receipt}" onclick="window.open().document.write('<img src=&quot;'+this.src+'&quot; style=&quot;max-width:100%&quot;>')">` : 'No receipt'}</div></div>
   <p class="small muted">Check your ${METHOD[p.method] || ''} app: same amount and reference number before approving.</p>
   ${p.status === 'for_verification' ? `<div class="row"><div><label>Note (optional)</label><input id="pnote"></div><button class="btn t" onclick="payAct(${id},'approve')">✔ Approve and activate</button><button class="btn g" onclick="payAct(${id},'reject')">Reject</button></div>` : ''}`);
}
async function payAct(id, action) {
  if (action === 'reject' && !confirm('Reject this payment?')) return;
  const j = await api('/api/admin/payments/' + id, {action, notes: ($('#pnote') || {}).value || ''});
  if (j.ok) { toast(action === 'approve' ? 'Approved - active until ' + fmtDate(j.until) : 'Rejected'); closeModal(); VIEW === 'dash' ? dash() : payments(); }
}

// ---------- parents
let parFilter = '';
async function parents(f) {
  if (typeof f === 'string') parFilter = f;
  const flt = [['', 'All'], ['active', 'Active'], ['trial', 'Trial'], ['expired', 'Expired'], ['blocked', 'On hold']];
  $('#main').innerHTML = `<div class="top"><h2>Parents</h2></div><div class="card"><div class="row" style="margin-bottom:12px"><div class="filters" id="parf">${flt.map(([k, l]) => `<button data-k="${k}" class="${k === parFilter ? 'on' : ''}">${l}</button>`).join('')}</div>
   <div style="max-width:260px"><input id="parQ" placeholder="Search name, phone, email"></div></div><div id="parList"></div></div>`;
  $('#parf').onclick = e => { const b = e.target.closest('button'); if (b) parents(b.dataset.k); };
  let t; $('#parQ').oninput = () => { clearTimeout(t); t = setTimeout(loadPar, 300); };
  loadPar();
}
async function loadPar() {
  const j = await api(`/api/admin/parents?filter=${parFilter}&q=${encodeURIComponent($('#parQ').value)}`); if (!j.ok) return;
  $('#parList').innerHTML = j.parents.length ? `<div class="tw"><table><tr><th>Parent</th><th>Kids</th><th>Status</th><th>Until</th><th>Total paid</th><th>Joined</th><th>Last login</th></tr>
   ${j.parents.map(p => `<tr class="click" onclick="openParent(${p.id})"><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.phone)} ${p.email ? '· ' + esc(p.email) : ''}</div></td><td>${p.kids}</td>
   <td>${badge(SUB, p.subscription.state)}</td><td>${fmtDate(p.subscription.until)}</td><td>${peso(p.paid_total)}</td><td class="small">${esc(p.created_at)}</td><td class="small">${esc(p.last_login || '')}</td></tr>`).join('')}</table></div>` : '<div class="empty">No parents found.</div>';
}
async function openParent(id) {
  const j = await api('/api/admin/parents/' + id); if (!j.ok) return;
  const p = j.parent;
  openModal(`<h2 style="font-size:22px">${esc(p.name)}</h2><div style="margin:6px 0">${badge(SUB, p.subscription.state)} ${p.subscription.until ? 'until ' + fmtDate(p.subscription.until) : ''}</div>
   <div class="kv" style="margin-top:10px"><div>Mobile</div><div><a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div><div>Email</div><div>${esc(p.email) || '-'}</div><div>Trial until</div><div>${fmtDate(p.trial_until)}</div><div>Joined</div><div>${esc(p.created_at)}</div></div>
   <div class="sect"><h3>Subscription</h3><div class="row"><div><label>Paid until</label><input type="date" id="pp_until" value="${esc(p.sub_until || '')}"></div><button class="btn" onclick="parSet(${id},{sub_until:$('#pp_until').value})">Save date</button>
     <button class="btn g" onclick="parSet(${id},{add_days:7})">+7 days</button><button class="btn g" onclick="parSet(${id},{add_days:30})">+30 days</button></div>
     <div class="row" style="margin-top:10px"><div><label>Account</label><select id="pp_status"><option value="active" ${p.status !== 'blocked' ? 'selected' : ''}>Active</option><option value="blocked" ${p.status === 'blocked' ? 'selected' : ''}>On hold (cannot log in)</option></select></div>
     <button class="btn" onclick="parSet(${id},{status:$('#pp_status').value})">Save</button><div><label>Reset password to</label><input id="pp_pw" placeholder="new password"></div><button class="btn g" onclick="parSet(${id},{new_password:$('#pp_pw').value})">Reset</button></div>
     <div style="margin-top:10px"><label>Notes</label><textarea id="pp_notes">${esc(p.admin_notes || '')}</textarea><button class="btn g" style="margin-top:6px" onclick="parSet(${id},{admin_notes:$('#pp_notes').value})">Save notes</button></div></div>
   <div class="sect"><h3>Children</h3>${j.children.length ? `<table><tr><th>Child</th><th>Grade</th><th>Stars</th><th>Today</th><th></th></tr>${j.children.map(c => `<tr><td>${c.avatar} <b>${esc(c.name)}</b> ${c.active ? '' : '<span class="badge bg-gray">removed</span>'}<div class="small muted">${c.age} yrs</div></td><td>${esc(c.grade_name)}</td><td>⭐ ${c.stars}</td><td>${c.minutes_today} min</td><td><button class="btn sm g" onclick="kidReport(${c.id})">Progress</button></td></tr>`).join('')}</table>` : '<div class="muted">No children added yet.</div>'}</div>
   <div class="sect"><h3>Payments</h3>${j.payments.length ? `<table>${j.payments.map(x => `<tr class="click" onclick="openPay(${x.id})"><td>${esc(x.code)}</td><td>${esc(x.plan_name)}</td><td>${peso(x.amount)}</td><td>${badge(PAY, x.status)}</td><td class="small">${esc(x.created_at)}</td></tr>`).join('')}</table>` : '<div class="muted">None</div>'}</div>`);
}
async function parSet(id, data) { const j = await api('/api/admin/parents/' + id, data); if (j.ok) { toast(j.until ? 'Active until ' + fmtDate(j.until) : 'Saved'); openParent(id); if (VIEW === 'parents') loadPar(); } }
async function kidReport(cid) {
  const j = await api(`/api/children/${cid}/report`); if (!j.ok) return;
  const c = j.child;
  openModal(`<h2 style="font-size:22px">${c.avatar} ${esc(c.name)}</h2><div class="muted">${esc(c.grade_name)} · ${c.age} yrs · ⭐ ${c.stars}</div>
   <div class="sect"><h3>Subjects</h3><table><tr><th>Subject</th><th>Level</th><th>Rounds</th><th>Correct</th></tr>${c.subjects.map(s => `<tr><td>${s.emoji} ${esc(s.name)}</td><td>${esc(s.level_name)}</td><td>${s.rounds}</td><td>${s.accuracy === null ? '-' : s.accuracy + '%'}</td></tr>`).join('')}</table></div>
   <div class="sect"><h3>Needs practice</h3>${j.weak_skills.map(w => `<span class="badge bg-yellow" style="margin-right:4px">${esc(w.skill)} (${w.n})</span>`).join('') || '<span class="muted">-</span>'}</div>
   <div class="sect"><h3>Recent rounds</h3>${j.recent.length ? `<table>${j.recent.map(r => `<tr><td>${esc(r.created_at)}</td><td>${esc(r.subject)}</td><td>${esc(r.level_name)}</td><td>${r.n_correct}/${r.n_items}</td><td>${Math.round(r.seconds / 60)} min</td></tr>`).join('')}</table>` : '<span class="muted">None yet</span>'}</div>`);
}

// ---------- learners
async function learners() {
  const j = await api('/api/admin/learners'); if (!j.ok) return;
  $('#main').innerHTML = `<div class="top"><h2>Learners</h2><div style="max-width:260px;flex:1"><input id="lq" placeholder="Search child or parent"></div></div><div class="card" id="lList"></div>`;
  const draw = () => {
    const q = $('#lq').value.toLowerCase();
    const rows = j.learners.filter(l => !q || (l.name + ' ' + l.parent_name).toLowerCase().includes(q));
    $('#lList').innerHTML = rows.length ? `<div class="tw"><table><tr><th>Child</th><th>Grade</th><th>Parent</th><th>Rounds</th><th>Total time</th><th>Stars</th><th>Last active</th></tr>
     ${rows.map(l => `<tr class="click" onclick="kidReport(${l.id})"><td>${l.avatar} <b>${esc(l.name)}</b><div class="small muted">${l.age} yrs</div></td><td>${esc(l.grade_name)}</td><td>${esc(l.parent_name)}<div class="small muted">${esc(l.phone)}</div></td><td>${l.rounds}</td><td>${Math.round(l.secs / 60)} min</td><td>⭐ ${l.stars}</td><td>${fmtDate(l.last_day)}</td></tr>`).join('')}</table></div>` : '<div class="empty">No learners yet.</div>';
  };
  $('#lq').oninput = draw; draw();
}

// ---------- plans
let PL = [];
async function plans() {
  const j = await api('/api/admin/plans'); if (!j.ok) return; PL = j.plans;
  $('#main').innerHTML = `<div class="top"><h2>Plans and prices</h2><button class="btn c" onclick="editPlan()">+ Add plan</button></div>
   <div class="card"><table><tr><th>Order</th><th>Plan</th><th>Days</th><th>Price</th><th>Per month</th><th>Shown</th></tr>
   ${PL.map(p => `<tr class="click" onclick="editPlan(${p.id})"><td>${p.sort}</td><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.description)}</div></td><td>${p.days}</td><td>${peso(p.price)}</td><td>${peso(p.price / p.days * 30)}</td><td>${p.active ? '<span class="badge bg-green">Yes</span>' : '<span class="badge bg-gray">Hidden</span>'}</td></tr>`).join('')}</table>
   <p class="small muted">Trial length, daily time limit and children per account are in Settings.</p></div>`;
}
function editPlan(id) {
  const p = PL.find(x => x.id === id) || {days: 30, active: 1, sort: PL.length + 1};
  openModal(`<h2 style="font-size:22px">${id ? 'Edit plan' : 'Add plan'}</h2><div class="g2" style="margin-top:14px">
   <div><label>Name</label><input id="pl_name" value="${esc(p.name || '')}"></div><div><label>Days</label><input type="number" id="pl_days" value="${p.days}"></div>
   <div><label>Price (₱)</label><input type="number" id="pl_price" value="${p.price ?? ''}"></div><div><label>Order</label><input type="number" id="pl_sort" value="${p.sort}"></div>
   <div><label>Show on website</label><select id="pl_active"><option value="1" ${p.active ? 'selected' : ''}>Yes</option><option value="0" ${!p.active ? 'selected' : ''}>Hidden</option></select></div></div>
   <div style="margin-top:10px"><label>Short description</label><input id="pl_desc" value="${esc(p.description || '')}"></div>
   <button class="btn c" style="margin-top:12px" id="pl_save">Save</button>`);
  $('#pl_save').onclick = async () => {
    const j = await api('/api/admin/plans' + (id ? '/' + id : ''), {name: $('#pl_name').value, days: $('#pl_days').value, price: $('#pl_price').value, sort: $('#pl_sort').value, active: $('#pl_active').value === '1' ? 1 : 0, description: $('#pl_desc').value});
    if (j.ok) { toast('Saved'); closeModal(); plans(); }
  };
}

// ---------- expenses
const EXP = ['Hosting / Render', 'Facebook ads', 'Load / internet', 'Design', 'Other'];
async function expenses() {
  $('#main').innerHTML = `<div class="top"><h2>Expenses</h2><div style="max-width:180px"><input type="month" id="exM" value="${todayISO().slice(0, 7)}"></div></div>
   <div class="card"><div class="row"><div><label>Date</label><input type="date" id="ex_d" value="${todayISO()}"></div><div><label>Category</label><select id="ex_c">${EXP.map(c => `<option>${c}</option>`).join('')}</select></div>
   <div><label>Amount (₱)</label><input type="number" id="ex_a"></div><div><label>Note</label><input id="ex_n"></div><button class="btn c" id="ex_add">Add</button></div>
   <p class="small muted">AI cost is estimated automatically in Reports, so do not add the Anthropic bill here or it will be counted twice.</p></div><div class="card" id="exList"></div>`;
  $('#exM').onchange = loadExp;
  $('#ex_add').onclick = async () => { const j = await api('/api/admin/expenses', {date: $('#ex_d').value, category: $('#ex_c').value, amount: $('#ex_a').value, note: $('#ex_n').value}); if (j.ok) { $('#ex_a').value = ''; $('#ex_n').value = ''; toast('Added'); loadExp(); } };
  loadExp();
}
async function loadExp() {
  const j = await api('/api/admin/expenses?month=' + $('#exM').value); if (!j.ok) return;
  const tot = j.expenses.reduce((a, e) => a + Number(e.amount), 0);
  $('#exList').innerHTML = j.expenses.length ? `<table><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr>${j.expenses.map(e => `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note)}</td><td><b>${peso(e.amount)}</b></td><td><button class="btn sm g" onclick="delExp(${e.id})">Delete</button></td></tr>`).join('')}<tr><td colspan="3"><b>Total</b></td><td><b>${peso(tot)}</b></td><td></td></tr></table>` : '<div class="empty">No expenses this month.</div>';
}
async function delExp(id) { if (confirm('Delete this expense?')) { const j = await api(`/api/admin/expenses/${id}/delete`, {}); if (j.ok) loadExp(); } }

// ---------- reports
async function reports() {
  $('#main').innerHTML = `<div class="top"><h2>Reports</h2><div class="row" style="max-width:300px"><input type="month" id="rpM" value="${todayISO().slice(0, 7)}"><button class="btn g" onclick="window.print()">Print</button></div></div><div id="rp"></div>`;
  $('#rpM').onchange = loadRep; loadRep();
}
async function loadRep() {
  const j = await api('/api/admin/report?month=' + $('#rpM').value); if (!j.ok) return;
  const mx = Math.max(1, ...j.trend.map(t => Math.max(t.revenue, t.ai_cost)));
  $('#rp').innerHTML = `<div class="kpis">
    <div class="kpi"><div class="v">${peso(j.revenue)}</div><div class="l">Revenue (approved)</div></div>
    <div class="kpi"><div class="v">${peso(j.ai_cost)}</div><div class="l">AI cost (estimated)</div></div>
    <div class="kpi"><div class="v">${peso(j.expense_total)}</div><div class="l">Other expenses</div></div>
    <div class="kpi ${j.net >= 0 ? 'good' : 'alert'}"><div class="v">${peso(j.net)}</div><div class="l">Net profit</div></div>
    <div class="kpi"><div class="v">${j.new_parents}</div><div class="l">New sign-ups</div></div>
    <div class="kpi"><div class="v">${j.ai.kids}</div><div class="l">Kids who learned</div></div>
    <div class="kpi"><div class="v">${peso(j.cost_per_kid)}</div><div class="l">AI cost per kid</div></div>
    <div class="kpi"><div class="v">${Math.round(j.ai.secs / 60)}</div><div class="l">Minutes learned</div></div></div>
   <div class="card"><h3>Revenue vs AI cost, last 6 months</h3><div class="bars">${j.trend.map(t => `<div><div class="pair"><span style="height:${Math.round(t.revenue / mx * 100)}%;background:var(--teal)" title="${peso(t.revenue)}"></span><span style="height:${Math.round(t.ai_cost / mx * 100)}%;background:var(--coral)" title="${peso(t.ai_cost)}"></span></div>${t.month.slice(5)}</div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--teal)"></i>Revenue</span><span><i style="background:var(--coral)"></i>AI cost</span></div></div>
   <div class="g2"><div class="card"><h3 style="margin-bottom:8px">Revenue by plan</h3>${j.by_plan.length ? `<table>${j.by_plan.map(p => `<tr><td>${esc(p.plan_name)}</td><td>${p.n}</td><td><b>${peso(p.amount)}</b></td></tr>`).join('')}</table>` : '<div class="empty">None</div>'}
     <h3 style="margin:16px 0 8px">Other expenses</h3>${j.expenses.length ? `<table>${j.expenses.map(e => `<tr><td>${esc(e.category)}</td><td><b>${peso(e.amount)}</b></td></tr>`).join('')}</table>` : '<div class="empty">None</div>'}</div>
   <div class="card"><h3 style="margin-bottom:8px">Learning</h3><div class="kv"><div>Rounds</div><div>${j.ai.rounds} (${j.ai.ai_rounds} by AI)</div><div>AI tokens</div><div>${Number(j.ai.tin).toLocaleString()} in · ${Number(j.ai.tout).toLocaleString()} out</div><div>AI cost (USD)</div><div>$${Number(j.ai.usd).toFixed(2)}</div></div>
     <h3 style="margin:16px 0 8px">By subject</h3>${j.subjects.length ? `<table><tr><th>Subject</th><th>Rounds</th><th>Correct</th></tr>${j.subjects.map(s => `<tr><td>${esc(s.name)}</td><td>${s.rounds}</td><td>${s.total ? Math.round(s.correct / s.total * 100) + '%' : '-'}</td></tr>`).join('')}</table>` : '<div class="empty">None</div>'}</div></div>`;
}

// ---------- settings
async function settings() {
  const j = await api('/api/admin/settings'); if (!j.ok) return; const s = j.settings;
  const inp = (k, l, t = 'text') => `<div><label>${l}</label><input id="s_${k}" type="${t}" value="${esc(s[k])}"></div>`;
  $('#main').innerHTML = `<div class="top"><h2>Settings</h2><button class="btn c" onclick="saveSettings()">Save all</button></div>
   <div class="card"><h3 style="margin-bottom:10px">AI tutor</h3>
     <p class="small">API key on server: ${j.ai_key ? '<span class="badge bg-green">Set</span>' : '<span class="badge bg-red">Not set</span>'} · Model: <b>${esc(j.model)}</b></p>
     <div class="g3"><div><label>AI tutor</label><select id="s_ai_enabled"><option value="1" ${s.ai_enabled === '1' ? 'selected' : ''}>ON (AI makes lessons)</option><option value="0" ${s.ai_enabled !== '1' ? 'selected' : ''}>OFF (built-in lessons only)</option></select></div>
     ${inp('tutor_name', 'Tutor name')}${inp('usd_php', 'USD to PHP rate', 'number')}${inp('ai_price_in', 'AI price per 1M input tokens (USD)', 'number')}${inp('ai_price_out', 'AI price per 1M output tokens (USD)', 'number')}</div>
     <button class="btn g" style="margin-top:10px" onclick="testAI()">Test AI now</button><div id="aiOut" class="small" style="margin-top:8px"></div></div>
   <div class="card"><h3 style="margin-bottom:10px">Limits</h3><div class="g3">${inp('trial_days', 'Free trial days (0 = no trial)', 'number')}${inp('daily_minutes', 'Daily minutes per child', 'number')}${inp('max_rounds_day', 'Max rounds per child per day', 'number')}${inp('max_children', 'Children per account', 'number')}</div>
     <p class="small muted">Each round has 5 questions (about 2-3 minutes). The rounds limit also caps AI cost per child.</p></div>
   <div class="card"><h3 style="margin-bottom:10px">Business</h3><div class="g2">${inp('business_name', 'Business name')}${inp('tagline', 'Tagline')}${inp('phone', 'Contact number')}${inp('email', 'Email')}${inp('facebook', 'Facebook page link')}</div>
     <div style="margin-top:10px"><label>Policy shown to parents</label><textarea id="s_policy">${esc(s.policy)}</textarea></div></div>
   <div class="card"><h3 style="margin-bottom:10px">Payment accounts <span class="small muted">(blank = hidden)</span></h3><div class="g3">
     ${inp('gcash_number', 'GCash number')}${inp('gcash_name', 'GCash name')}<div></div>${inp('maya_number', 'Maya number')}${inp('maya_name', 'Maya name')}<div></div>
     ${inp('bank_name', 'Bank')}${inp('bank_acct_no', 'Account number')}${inp('bank_acct_name', 'Account name')}</div></div>
   <button class="btn c" onclick="saveSettings()">Save all</button>`;
}
async function saveSettings() {
  const d = {};
  document.querySelectorAll('[id^="s_"]').forEach(e => d[e.id.slice(2)] = e.value);
  const j = await api('/api/admin/settings', d); if (j.ok) toast('Settings saved');
}
async function testAI() {
  $('#aiOut').textContent = 'Asking the AI...';
  const j = await api('/api/admin/test-ai', {});
  $('#aiOut').innerHTML = j.ok ? `✅ Working! Sample question: <b>${esc(j.sample.say)}</b> → ${j.sample.choices.map(esc).join(' / ')} <span class="muted">(${j.usage.input_tokens} in, ${j.usage.output_tokens} out tokens)</span>` : '❌ ' + esc(j.error);
}

if (TOKEN) start();
</script>
</body>
</html>
